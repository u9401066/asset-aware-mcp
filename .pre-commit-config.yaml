# Pre-commit hooks for asset-aware-mcp
# Install: uv run pre-commit install --hook-type pre-commit --hook-type pre-push --hook-type commit-msg
# Run all: uv run pre-commit run --all-files
# Update:  uv run pre-commit autoupdate
#
# Python lint/format/type/security checks run through scripts/pretest.py with
# the uv.lock versions CI uses (ruff, mypy, bandit), not pinned mirror repos
# that drift from CI. Commit time runs `pretest.py --quick` (offline, working
# tree); push time runs the full CI-parity gate (every ci.yml job plus the
# release.yml `test` job; Linux jobs in the Ubuntu WSL distro). See
# CONTRIBUTING.md "本機 CI 對等檢查".

default_language_version:
  python: python3

repos:
  # ── General file hygiene ────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]  # allow custom YAML tags
      - id: check-toml
      - id: check-json
        types: [json]
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: check-symlinks
      - id: debug-statements
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  # ── Commit message: Conventional Commits ────────────────────
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.0.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          - feat
          - fix
          - docs
          - refactor
          - test
          - chore
          - style
          - perf
          - ci
          - build
          - revert

  # ── TypeScript / VS Code Extension ──────────────────────────
  - repo: local
    hooks:
      # ESLint for TypeScript
      - id: eslint-vsx
        name: eslint (vscode-extension)
        entry: cmd /c "cd vscode-extension && npx eslint ."
        language: system
        files: ^vscode-extension/src/.*\.[tj]sx?$
        pass_filenames: false

      # TypeScript compile check
      - id: tsc-vsx
        name: tsc compile (vscode-extension)
        entry: cmd /c "cd vscode-extension && npx tsc -p ./ --noEmit"
        language: system
        files: ^vscode-extension/src/.*\.tsx?$
        pass_filenames: false

  # ── Local hooks ─────────────────────────────────────────────
  - repo: local
    hooks:
      # Commit size guard (max 30 files per commit)
      - id: commit-size-guard
        name: commit-size-guard (max 30 files)
        entry: python scripts/commit_size_guard.py
        language: python
        always_run: true
        pass_filenames: false
        stages: [pre-commit]

      # CI-parity quick gate: ruff, ruff format, mypy, bandit, zizmor, uv lock,
      # docs payload, release harness and VSIX asset sync with CI's versions.
      - id: ci-parity-quick
        name: ci-parity quick gate (scripts/pretest.py --quick)
        entry: python scripts/pretest.py --quick
        language: python
        always_run: true
        pass_filenames: false
        stages: [pre-commit]

      # Full CI-parity gate on the commit being pushed: every ci.yml job and
      # release.yml `test` (uv audit, npm audits, unit, LibreOffice integration,
      # Python 3.11 smoke, VSIX smokes, Windows smoke). macOS is NOT VERIFIED.
      - id: ci-parity-gate
        name: ci-parity gate (scripts/pretest.py, all CI jobs)
        entry: python scripts/pretest.py
        language: python
        always_run: true
        pass_filenames: false
        stages: [pre-push]
        verbose: true
