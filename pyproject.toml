[project]
name = "asset-aware-mcp"
version = "0.5.2"
description = "Medical RAG with Asset-Aware MCP - Precise PDF asset retrieval (tables, figures, sections) for AI Agents"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [
    { name = "u9401066", email = "u9401066@gap.kmu.edu.tw" }
]
maintainers = [
    { name = "u9401066", email = "u9401066@gap.kmu.edu.tw" }
]
keywords = ["mcp", "rag", "medical", "pdf", "lightrag", "fastmcp", "ai", "llm", "document-processing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Text Processing :: General",
    "Typing :: Typed",
]
dependencies = [
    "mcp>=1.0.0",
    "lightrag-hku>=1.0.0",
    "mistralai>=1.0.0",
    "pydantic>=2.0.0",
    "aiofiles>=24.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.28.1",
    "Pillow>=10.0.0",
    "PyMuPDF>=1.24.0", # Core PDF backend (lightweight)
    "xlsxwriter>=3.2.9",
    "pydantic-settings>=2.12.0",
    "tabulate>=0.9.0",
    "lxml>=5.0.0",
    "pyyaml>=6.0.0",
    "python-docx>=1.2.0",
]

[project.optional-dependencies]
marker = [
    "marker-pdf>=1.10.2",
]

[project.urls]
Homepage = "https://github.com/u9401066/asset-aware-mcp"
Documentation = "https://github.com/u9401066/asset-aware-mcp#readme"
Repository = "https://github.com/u9401066/asset-aware-mcp.git"
Issues = "https://github.com/u9401066/asset-aware-mcp/issues"
Changelog = "https://github.com/u9401066/asset-aware-mcp/blob/main/CHANGELOG.md"

[project.scripts]
asset-aware-mcp = "src.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "S",    # flake8-bandit (security)
    "SIM",  # flake8-simplify
    "PTH",  # flake8-use-pathlib
    "RUF",  # ruff-specific rules
    "T20",  # flake8-print (no print in production)
    "PIE",  # flake8-pie (misc lints)
    "TCH",  # flake8-type-checking
    "PERF", # perflint
]
ignore = [
    "E501",   # line length (handled by formatter)
    "S101",   # assert in tests is fine
    "S603",   # subprocess calls (too noisy)
    "S607",   # partial executable path (too noisy)
    "RUF001", # ambiguous unicode char in string (CJK false positives)
    "RUF002", # ambiguous unicode char in docstring (CJK false positives)
    "RUF003", # ambiguous unicode char in comment (CJK false positives)
    "PERF203", # try-except in loop — unavoidable for per-item error recovery
    "PERF401", # list.append in loop — sometimes more readable than extend
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S106", "T20", "TCH"]  # allow assert, hardcoded passwords in tests, print, type-checking
"scripts/**/*.py" = ["T20"]  # allow print in scripts

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]
follow_imports = "silent"

[[tool.mypy.overrides]]
module = [
    "marker.*",
    "torch.*",
    "lightrag.*",
    "mistralai.*",
    "fitz.*",
    "pymupdf.*",
    "surya.*",
]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["-v", "--tb=short", "-ra"]

[tool.bandit]
exclude_dirs = ["tests", "scripts"]
skips = ["B101"]  # assert_used — fine in application code

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=5.0.0",
    "pytest-timeout>=2.3.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "bandit>=1.7.0",
    "pre-commit>=4.0.0",
    "types-pyyaml>=6.0.12.20250915",
]
