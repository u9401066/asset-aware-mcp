name: CI

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # ==========================================
  # 文檔檢查
  # ==========================================
  docs-check:
    name: 📚 Documentation Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required files exist
        run: |
          files=("README.md" "CHANGELOG.md" "CONSTITUTION.md" "LICENSE")
          for file in "${files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "❌ Missing required file: $file"
              exit 1
            fi
          done
          echo "✅ All required files exist"

  # ==========================================
  # Python 靜態分析
  # ==========================================
  static-analysis:
    name: 🔍 Static Analysis (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync

      - name: Ruff Linting
        run: uv run ruff check . --output-format=github

      - name: Ruff Format Check
        run: uv run ruff format --check .

      - name: MyPy Type Check
        timeout-minutes: 5
        run: uv run mypy src --ignore-missing-imports

  # ==========================================
  # macOS 安裝/Extension Smoke Test
  # ==========================================
  macos-smoke:
    name: 🍎 macOS Smoke Test
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install via project installer
        run: bash scripts/install.sh

      - name: Run installer diagnostics
        run: bash scripts/install.sh --check

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run VS Code extension unit tests
        run: |
          cd vscode-extension
          npm ci
          npm run test:unit

      - name: Run VSIX install smoke test
        run: |
          cd vscode-extension
          npm run test:install-smoke

  # ==========================================
  # Windows 安裝/Extension Smoke Test
  # ==========================================
  windows-smoke:
    name: 🪟 Windows Smoke Test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install via project installer
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/install.ps1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run VS Code extension unit tests
        shell: pwsh
        run: |
          cd vscode-extension
          npm ci
          npm run test:unit

      - name: Run VSIX install smoke test
        shell: pwsh
        run: |
          cd vscode-extension
          npm run test:install-smoke

  # ==========================================
  # Linux VSIX 安裝/更新 Smoke Test
  # ==========================================
  linux-vsix-smoke:
    name: 🐧 Linux VSIX Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install xvfb and unzip
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb unzip libgbm1 libgtk-3-0 libnss3 libxss1 libasound2t64

      - name: Run VSIX install smoke test
        run: |
          cd vscode-extension
          npm ci
          xvfb-run -a npm run test:install-smoke

  # ==========================================
  # Python 單元測試
  # ==========================================
  unit-tests:
    name: 🧪 Unit Tests (Python)
    runs-on: ubuntu-latest
    needs: static-analysis
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync

      - name: Run Unit Tests with Coverage
        run: |
          uv run pytest tests/unit -v \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:coverage-unit.xml \
            --timeout=60 \
            --junitxml=junit-unit.xml

      - name: Upload Unit Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-unit
          path: junit-unit.xml
          retention-days: 30

  # ==========================================
  # DFM + MCP 整合測試
  # ==========================================
  integration-tests:
    name: 🔗 Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync

      - name: Run DFM + MCP Integration Tests
        run: |
          uv run pytest \
            tests/test_dfm.py \
            tests/test_docx_validator.py \
            tests/test_dfm_table_bridge.py \
            tests/test_mcp_tools.py \
            -v --timeout=120 --junitxml=junit-integration.xml

      - name: Upload Integration Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-integration
          path: junit-integration.xml
          retention-days: 30

  # ==========================================
  # 測試結果摘要
  # ==========================================
  test-summary:
    name: 📋 Test Summary
    runs-on: ubuntu-latest
    needs: [docs-check, static-analysis, macos-smoke, windows-smoke, linux-vsix-smoke, unit-tests, integration-tests]
    if: always()
    steps:
      - name: Generate Summary
        run: |
          echo "## 🧪 Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 📚 Documentation | ${{ needs.docs-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔍 Static Analysis | ${{ needs.static-analysis.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🍎 macOS Smoke Test | ${{ needs.macos-smoke.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🪟 Windows Smoke Test | ${{ needs.windows-smoke.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🐧 Linux VSIX Smoke Test | ${{ needs.linux-vsix-smoke.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🧪 Unit Tests | ${{ needs.unit-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔗 Integration Tests | ${{ needs.integration-tests.result }} |" >> $GITHUB_STEP_SUMMARY
