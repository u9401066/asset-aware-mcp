name: CI

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ==========================================
  # 文檔檢查
  # ==========================================
  docs-check:
    name: 📚 Documentation Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required files exist
        run: |
          files=("README.md" "CHANGELOG.md" "CONSTITUTION.md" "LICENSE")
          for file in "${files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "❌ Missing required file: $file"
              exit 1
            fi
          done
          echo "✅ All required files exist"

      - name: Check Markdown files
        uses: articulate/actions-markdownlint@v1
        with:
          files: '**/*.md'
          ignore: 'node_modules'
        continue-on-error: true

  # ==========================================
  # Python 靜態分析
  # ==========================================
  static-analysis:
    name: 🔍 Static Analysis (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          uv sync --all-extras

      - name: Ruff Linting
        run: |
          uv run ruff check . --output-format=github

      - name: Ruff Format Check
        run: |
          uv run ruff format --check .

      - name: MyPy Type Check
        run: |
          uv run mypy src --ignore-missing-imports

      - name: Bandit Security Scan
        run: |
          uv run bandit -r src -f json -o bandit-report.json
          uv run bandit -r src -f txt
        continue-on-error: true

      - name: Upload Bandit Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-security-report
          path: bandit-report.json
          retention-days: 30

  # ==========================================
  # Python 單元測試
  # ==========================================
  unit-tests:
    name: 🧪 Unit Tests (Python)
    runs-on: ubuntu-latest
    needs: static-analysis
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          uv sync --all-extras

      - name: Run Unit Tests with Coverage
        run: |
          uv run pytest tests/unit -v \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:coverage-unit.xml \
            --cov-report=html:htmlcov-unit \
            --cov-fail-under=70 \
            -n auto \
            --timeout=60 \
            --junitxml=junit-unit.xml

      - name: Upload Unit Test Coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-unit
          path: |
            coverage-unit.xml
            htmlcov-unit/
          retention-days: 30

      - name: Upload Unit Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-unit
          path: junit-unit.xml
          retention-days: 30

  # ==========================================
  # Python 整合測試
  # ==========================================
  integration-tests:
    name: 🔗 Integration Tests (Python)
    runs-on: ubuntu-latest
    needs: unit-tests
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test_db
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run Integration Tests with Coverage
        run: |
          uv run pytest tests/integration -v \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:coverage-integration.xml \
            --cov-report=html:htmlcov-integration \
            --timeout=120 \
            --junitxml=junit-integration.xml \
            -m integration \
            || true
        continue-on-error: true

      - name: Upload Integration Test Coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-integration
          path: |
            coverage-integration.xml
            htmlcov-integration/
          retention-days: 30

      - name: Upload Integration Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-integration
          path: junit-integration.xml
          retention-days: 30

  # ==========================================
  # E2E 測試 (Playwright)
  # ==========================================
  e2e-tests:
    name: 🎭 E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: integration-tests
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test_db
      APP_URL: http://localhost:8000

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Install Playwright browsers
        run: uv run playwright install --with-deps chromium

      - name: Start application server
        run: |
          # 啟動應用程式（背景執行）
          # 根據專案調整啟動命令
          if [ -f "src/main.py" ]; then
            uv run uvicorn src.main:app --host 0.0.0.0 --port 8000 &
          fi
          # 等待服務啟動
          sleep 5
        continue-on-error: true

      - name: Run E2E Tests
        run: |
          uv run pytest tests/e2e -v \
            --browser chromium \
            --tracing retain-on-failure \
            --screenshot only-on-failure \
            --video retain-on-failure \
            --output test-results \
            --junitxml=junit-e2e.xml \
            -m e2e \
            || true
        continue-on-error: true

      - name: Upload E2E Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-results
          path: |
            test-results/
            junit-e2e.xml
          retention-days: 30

      - name: Upload Playwright Traces
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  # ==========================================
  # 覆蓋率報告合併
  # ==========================================
  coverage-report:
    name: 📊 Coverage Report
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, e2e-tests]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Download Unit Coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-unit
          path: coverage-unit
        continue-on-error: true

      - name: Download Integration Coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-integration
          path: coverage-integration
        continue-on-error: true

      - name: Combine Coverage Reports
        run: |
          uv run coverage combine coverage-unit/.coverage* coverage-integration/.coverage* 2>/dev/null || true
          uv run coverage xml -o coverage-combined.xml || true
          uv run coverage report --fail-under=80 || true
        continue-on-error: true

      - name: Upload Combined Coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage-combined.xml,coverage-unit/coverage-unit.xml,coverage-integration/coverage-integration.xml
          fail_ci_if_error: false
          verbose: true
        continue-on-error: true

      - name: Coverage Summary
        run: |
          echo "## 📊 Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          uv run coverage report --format=markdown >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "Coverage report not available" >> $GITHUB_STEP_SUMMARY
        continue-on-error: true

  # ==========================================
  # 測試結果摘要
  # ==========================================
  test-summary:
    name: 📋 Test Summary
    runs-on: ubuntu-latest
    needs: [static-analysis, unit-tests, integration-tests, e2e-tests, coverage-report]
    if: always()
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
        continue-on-error: true

      - name: Generate Summary
        run: |
          echo "## 🧪 Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Static Analysis | ${{ needs.static-analysis.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.unit-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration Tests | ${{ needs.integration-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| E2E Tests | ${{ needs.e2e-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Coverage Report | ${{ needs.coverage-report.result }} |" >> $GITHUB_STEP_SUMMARY
