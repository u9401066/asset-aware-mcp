  # ==========================================
  # Linux VSIX 安裝/更新 Smoke Test
  # ==========================================
  linux-vsix-smoke:
    name: 🐧 Linux VSIX Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.12.3"
          enable-cache: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install xvfb and unzip
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb unzip libgbm1 libgtk-3-0 libnss3 libxss1 libasound2t64

      - name: Run VSIX install smoke test
        run: |
          cd vscode-extension
          npm ci
          npm run sync-assets:check
          npm run test:ci
          xvfb-run -a npm run test:install-smoke -- --require-activation

  # ==========================================
  # Python 單元測試
  # ==========================================
  unit-tests:
    name: 🧪 Unit Tests (Python)
    runs-on: ubuntu-latest
    needs: static-analysis
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js for CSL
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.12.3"
          enable-cache: false

      - name: Set up Python
        run: uv python install "$PYTHON_VERSION"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Unit Tests with Coverage
        run: |
          uv run pytest tests/unit -v \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:coverage-unit.xml \
            --timeout=60 \
            --junitxml=junit-unit.xml

      - name: Upload Unit Test Results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: junit-unit
          path: junit-unit.xml
          retention-days: 30

  # ==========================================
  # DFM + MCP 整合測試
  # ==========================================
  integration-tests:
    name: 🔗 Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js for CSL
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.12.3"
          enable-cache: false

      - name: Set up Python
        run: uv python install "$PYTHON_VERSION"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Install optional Writer and Impress renderers for real image tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-impress libreoffice-writer fontconfig fonts-liberation

      - name: Prepare private pinned CJK font fixture
        run: uv run python -m tests.codex_docx_structure.fonts --output "$RUNNER_TEMP/asset-aware-cjk-fonts"

      - name: Fetch and verify pinned public PDF corpus
        run: uv run python -m tests.real_pdf.corpus --directory "$RUNNER_TEMP/asset-aware-real-pdf-corpus" --fetch

      - name: Run DFM + MCP Integration Tests
        env:
          NATIVE_PPTX_RENDER_TEST: "1"
          NATIVE_DOCX_RENDER_TEST: "1"
          NATIVE_DOCX_FONT_FIXTURE: ${{ runner.temp }}/asset-aware-cjk-fonts
          ASSET_AWARE_REAL_PDF_CORPUS: ${{ runner.temp }}/asset-aware-real-pdf-corpus
        run: |
          uv run pytest \
            tests/test_dfm.py \
            tests/test_docx_validator.py \
            tests/test_dfm_table_bridge.py \
            tests/test_mcp_tools.py \
            tests/integration/test_docx_complex_sample_roundtrip.py \
            tests/integration/test_pdf_asset_stdio_e2e.py \
            tests/integration/test_pdf_crud_stdio_matrix.py \
            tests/integration/test_native_pdf_stdio.py \
            tests/integration/test_native_pdf_regions_stdio.py \
            tests/integration/test_native_delimited_stdio.py \
            tests/integration/test_real_pdf_corpus_stdio.py \
            tests/integration/test_csl_citations_stdio.py \
            tests/integration/test_etl_citations_stdio.py \
            tests/integration/test_native_pptx_picture_stdio.py \
            tests/integration/test_native_pptx_table_stdio.py \
            tests/integration/test_native_pptx_grid_stdio.py \
            tests/integration/test_native_pptx_merge_stdio.py \
            tests/integration/test_native_pptx_slide_stdio.py \
            tests/integration/test_native_pptx_render_stdio.py \
            tests/integration/test_native_docx_render_stdio.py \
            tests/integration/test_native_docx_grid_stdio.py \
            tests/integration/test_native_docx_layout_stdio.py \
            tests/integration/test_native_docx_stories_stdio.py \
            tests/integration/test_native_docx_story_lifecycle_stdio.py \
            tests/integration/test_native_docx_notes_stdio.py \
            tests/integration/test_native_docx_cjk_stdio.py \
            tests/integration/test_native_derivation_stdio.py \
            -v --timeout=180 --junitxml=junit-integration.xml

      - name: Upload Integration Test Results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: junit-integration
          path: junit-integration.xml
          retention-days: 30

  # ==========================================
  # 測試結果摘要
  # ==========================================
  test-summary:
    name: 📋 Test Summary
    runs-on: ubuntu-latest
    needs:
      - docs-check
      - static-analysis
      - python310-mcp-smoke
      - npm-security
      - macos-smoke
      - windows-smoke
      - linux-vsix-smoke
      - unit-tests
      - integration-tests
    if: always()
    steps:
      - name: Generate and enforce summary
        env:
          DOCS_RESULT: ${{ needs.docs-check.result }}
          STATIC_RESULT: ${{ needs.static-analysis.result }}
          PYTHON310_MCP_RESULT: ${{ needs.python310-mcp-smoke.result }}
          NPM_SECURITY_RESULT: ${{ needs.npm-security.result }}
          MACOS_RESULT: ${{ needs.macos-smoke.result }}
          WINDOWS_RESULT: ${{ needs.windows-smoke.result }}
          LINUX_VSIX_RESULT: ${{ needs.linux-vsix-smoke.result }}
          UNIT_RESULT: ${{ needs.unit-tests.result }}
          INTEGRATION_RESULT: ${{ needs.integration-tests.result }}
        run: |
          results=(
            "📚 Documentation|$DOCS_RESULT"
            "🔍 Static Analysis|$STATIC_RESULT"
            "🐍 Python 3.10 MCP Runtime|$PYTHON310_MCP_RESULT"
            "🛡️ npm Zero-Vulnerability Audit|$NPM_SECURITY_RESULT"
            "🍎 macOS Smoke Test|$MACOS_RESULT"
            "🪟 Windows Smoke Test|$WINDOWS_RESULT"
            "🐧 Linux VSIX Smoke Test|$LINUX_VSIX_RESULT"
            "🧪 Unit Tests|$UNIT_RESULT"
            "🔗 Integration Tests|$INTEGRATION_RESULT"
          )

          {
            echo "## 🧪 Test Results Summary"
            echo
            echo "| Stage | Status |"
            echo "|-------|--------|"
          } >> "$GITHUB_STEP_SUMMARY"

          failed=0
          for entry in "${results[@]}"; do
            IFS='|' read -r stage status <<< "$entry"
            printf '| %s | %s |\n' "$stage" "$status" >> "$GITHUB_STEP_SUMMARY"
            if [ "$status" != "success" ]; then
              echo "ERROR: $stage finished with non-success result: $status"
              failed=1
            fi
          done

          exit "$failed"
