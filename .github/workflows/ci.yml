  # ==========================================
  # npm dependency security gate
  # ==========================================
  npm-security:
    name: 🛡️ npm Zero-Vulnerability Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
