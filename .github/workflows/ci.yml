        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Audit locked npm dependencies
        run: npm audit --package-lock-only --audit-level=low

      - name: Audit bundled CSL processor dependency
        working-directory: .
        run: npm --prefix src/infrastructure/csl_resources audit --package-lock-only --audit-level=low

