name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

# CI jobs only need read access to the checked-out source tree.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "24"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ==========================================
  # 文檔檢查
  # ==========================================
  docs-check:
    name: 📚 Documentation Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check required files exist
        run: |
          files=("README.md" "CHANGELOG.md" "CONSTITUTION.md" "LICENSE")
          for file in "${files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "❌ Missing required file: $file"
              exit 1
            fi
          done
          echo "✅ All required files exist"

      - name: Check docs site payload
        run: python3 scripts/build_docs_site.py --check

  # ==========================================
  # Python 靜態分析
  # ==========================================
  static-analysis:
    name: 🔍 Static Analysis (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.12.3"
          enable-cache: false

      - name: Set up Python
        run: uv python install "$PYTHON_VERSION"

      - name: Verify and audit dependency lock
        run: |
          uv lock --check
          uv audit --preview-features audit-command --frozen --python-version 3.10

      - name: Install dependencies
        run: uv sync --frozen

      - name: Audit GitHub Actions workflows
        run: uv run zizmor --persona=regular --min-severity high .github/workflows

      - name: Ruff Linting
        run: uv run ruff check . --output-format=github

      - name: Ruff Format Check
        run: uv run ruff format --check .

      - name: MyPy Type Check
        timeout-minutes: 5
        run: uv run mypy src --ignore-missing-imports

      - name: Bandit medium/high security scan
        run: uv run bandit -q -r src -x tests --severity-level medium

  # ==========================================
  # Python 3.10 + MCP runtime compatibility
  # ==========================================
  python310-mcp-smoke:
    name: 🐍 Python 3.10 MCP Runtime Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
