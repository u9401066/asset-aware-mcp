name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.2.0)'
        required: true
        type: string
      prerelease:
        description: 'Is this a pre-release?'
        required: false
        type: boolean
        default: false

# Validation/publish jobs default to read-only; only scoped jobs elevate below.
permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "24"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  RELEASE_INPUT_VERSION: ${{ inputs.version }}
  RELEASE_EVENT_NAME: ${{ github.event_name }}

jobs:
  # ==========================================
  # 測試確認
  # ==========================================
  test:
    name: 🧪 Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve and validate release source
        run: |
          if [ "$RELEASE_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="${RELEASE_INPUT_VERSION}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: invalid release version: $VERSION"
            exit 1
          fi

          TAG="v${VERSION}"
          git fetch --force --tags origin \
            "+refs/heads/main:refs/remotes/origin/main"

          TAG_TYPE="$(git cat-file -t "refs/tags/${TAG}" 2>/dev/null || true)"
          if [ "$TAG_TYPE" != "tag" ]; then
            echo "ERROR: refs/tags/${TAG} must be an annotated tag"
            exit 1
          fi

          TAG_OBJECT_SHA="$(git rev-parse "refs/tags/${TAG}")"
          REMOTE_TAG_OBJECT_SHA="$(
            git ls-remote --tags origin "refs/tags/${TAG}" \
              | awk -v ref="refs/tags/${TAG}" '$2 == ref { print $1 }'
          )"
          if [ -z "$REMOTE_TAG_OBJECT_SHA" ] || [ "$TAG_OBJECT_SHA" != "$REMOTE_TAG_OBJECT_SHA" ]; then
            echo "ERROR: local annotated tag does not match refs/tags/${TAG} on origin"
            exit 1
          fi

          TAG_COMMIT_SHA="$(git rev-parse "refs/tags/${TAG}^{}")"
          if [ "$TAG_COMMIT_SHA" != "$GITHUB_SHA" ]; then
            echo "ERROR: annotated tag resolves to $TAG_COMMIT_SHA, expected workflow SHA $GITHUB_SHA"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$TAG_COMMIT_SHA" origin/main; then
            echo "ERROR: tagged commit is not in origin/main history"
            exit 1
          fi

          PYTHON_VERSION="$(python3 scripts/get_version.py --strict-semver)"
          VSCODE_VERSION="$(
            python3 -c 'import json; print(json.load(open("vscode-extension/package.json", encoding="utf-8"))["version"])'
          )"
          if [ "$PYTHON_VERSION" != "$VERSION" ] || [ "$VSCODE_VERSION" != "$VERSION" ]; then
            echo "ERROR: release version mismatch"
            echo "  requested/tag: $VERSION"
            echo "  pyproject:     $PYTHON_VERSION"
            echo "  VSIX package:  $VSCODE_VERSION"
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.12.3"
          enable-cache: false

      - name: Set up Python
        run: uv python install "$PYTHON_VERSION"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install dependencies
        run: |
          uv lock --check
          uv audit --preview-features audit-command --frozen --python-version 3.10
          uv sync --frozen

      - name: Run tests
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src/ --ignore-missing-imports
          uv run bandit -q -r src -x tests --severity-level medium
          uv run pytest

      - name: Audit release harness
        run: python3 scripts/audit_release_harness.py

      - name: Audit GitHub Actions workflows
        run: uv run zizmor --persona=regular --min-severity high .github/workflows

      - name: Run VS Code extension CI
        run: |
          cd vscode-extension
          npm ci
          npm audit --package-lock-only --audit-level=low
          npm run sync-assets:check
          npm run test:ci

      - name: Install Linux desktop smoke dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb unzip libgbm1 libgtk-3-0 libnss3 libxss1 libasound2t64

      - name: Run VSIX install and activation smoke test
        run: |
          cd vscode-extension
          xvfb-run -a npm run test:install-smoke -- --require-activation

  cross-platform-smoke:
    name: Cross-platform VSIX smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.12.3"
          enable-cache: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install Linux desktop smoke dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb unzip libgbm1 libgtk-3-0 libnss3 libxss1 libasound2t64

      - name: Run packaged install smoke
        shell: bash
        run: |
          cd vscode-extension
          npm ci
          npm run sync-assets:check
          if [ "${RUNNER_OS}" = "Linux" ]; then
            xvfb-run -a npm run test:install-smoke -- --require-activation
          else
            npm run test:install-smoke
          fi

  release-preflight:
    name: Release artifact preflight
    runs-on: ubuntu-latest
    needs: [test, cross-platform-smoke]
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.12.3"
          enable-cache: false

      - name: Set up Python
        run: uv python install "$PYTHON_VERSION"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install extension dependencies
        working-directory: vscode-extension
        run: npm ci

      - name: Verify Marketplace publish rights before publishing
        working-directory: vscode-extension
        run: |
          if [ -z "${VSCE_PAT}" ]; then
            echo "ERROR: VSCE_PAT is not configured; refusing to publish PyPI first."
            exit 1
          fi
          npx --no-install vsce verify-pat u9401066
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Build Python artifacts
        run: uv build

      - name: Smoke built wheel runtime before publishing
        run: python3 scripts/smoke_built_wheel.py

      - name: Package VSIX before publishing PyPI
        run: |
          cd vscode-extension
          npm run sync-assets:check
          npm run test:ci
          if [ "$RELEASE_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="${RELEASE_INPUT_VERSION}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          npx vsce package --no-dependencies --out "asset-aware-mcp-${VERSION}.vsix"

      - name: Audit prepublish release artifacts
        run: python3 scripts/audit_release_artifacts.py --require all

      - name: Docker smoke diagnostics
        run: |
          if [ "$RELEASE_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="${RELEASE_INPUT_VERSION}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          docker build -t "asset-aware-mcp:${VERSION}-release-smoke" .
          docker run --rm "asset-aware-mcp:${VERSION}-release-smoke" doctor --json
          docker run --rm "asset-aware-mcp:${VERSION}-release-smoke" list-tools --json
          uv run python scripts/smoke_mcp_stdio.py -- docker run --rm -i "asset-aware-mcp:${VERSION}-release-smoke"

  # ==========================================
  # 發布到 PyPI
  # ==========================================
  publish-pypi:
    name: 📦 Publish to PyPI
    runs-on: ubuntu-latest
    needs: release-preflight
    environment: release
    permissions:
      contents: read
      id-token: write # Required for PyPI Trusted Publishing via OIDC.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.12.3"
          enable-cache: false

      - name: Set up Python
        run: uv python install "$PYTHON_VERSION"

      - name: Build package
        run: |
          uv build

      - name: Audit Python release artifacts
        run: |
          python3 scripts/audit_release_artifacts.py --require python
          python3 scripts/smoke_built_wheel.py

      - name: Check whether PyPI version already exists
        id: pypi_exists
        run: |
          if [ "$RELEASE_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="${RELEASE_INPUT_VERSION}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          VERSION="$VERSION" python3 - <<'PY'
          import os
          import urllib.error
          import urllib.request

          version = os.environ["VERSION"]
          url = f"https://pypi.org/pypi/asset-aware-mcp/{version}/json"
          try:
              with urllib.request.urlopen(url, timeout=30):
                  exists = True
          except urllib.error.HTTPError as exc:
              if exc.code == 404:
                  exists = False
              else:
                  raise
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"exists={str(exists).lower()}\n")
          print(f"PyPI asset-aware-mcp=={version} exists: {exists}")
          PY

      - name: Publish to PyPI
        if: steps.pypi_exists.outputs.exists != 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          verbose: true

      - name: Reuse existing PyPI version
        if: steps.pypi_exists.outputs.exists == 'true'
        run: echo "PyPI already has this version; continuing to VSIX publish verification."

  # ==========================================
  # 發布到 VS Code Marketplace
  # ==========================================
  publish-vscode:
    name: 🧩 Publish to VS Code Marketplace
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: publish-pypi
    environment: release
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.12.3"
          enable-cache: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Verify PyPI package is available
        timeout-minutes: 30
        working-directory: .
        run: |
          if [ "$RELEASE_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="${RELEASE_INPUT_VERSION}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi

          for attempt in $(seq 1 12); do
            if timeout 90s uvx --refresh --python "$PYTHON_VERSION" --from "asset-aware-mcp==$VERSION" asset-aware-mcp --help \
              && timeout 90s uvx --refresh --python "$PYTHON_VERSION" --from "asset-aware-mcp==$VERSION" asset-aware-mcp doctor --json \
              && timeout 90s uvx --refresh --python "$PYTHON_VERSION" --from "asset-aware-mcp==$VERSION" asset-aware-mcp list-tools --json \
              && timeout 90s uv run --no-project --python "$PYTHON_VERSION" --with "asset-aware-mcp==$VERSION" python scripts/smoke_mcp_stdio.py -- asset-aware-mcp; then
              exit 0
            fi
            echo "PyPI package asset-aware-mcp==$VERSION not available yet (attempt $attempt/12); retrying..."
            sleep 30
          done

          echo "ERROR: PyPI package asset-aware-mcp==$VERSION was not installable before VSIX publish"
          exit 1

      - name: Install dependencies
        run: npm ci

      - name: Run extension CI
        run: |
          npm run sync-assets:check
          npm run test:ci

      - name: Package extension
        run: |
          if [ "$RELEASE_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="${RELEASE_INPUT_VERSION}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          npx vsce package --no-dependencies --out "asset-aware-mcp-${VERSION}.vsix"

      - name: Verify VSIX integrity
        id: verify
        run: |
          if [ "$RELEASE_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="${RELEASE_INPUT_VERSION}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          VSIX_FILE="asset-aware-mcp-${VERSION}.vsix"
          if [ -z "$VSIX_FILE" ] || [ ! -f "$VSIX_FILE" ]; then
            echo "ERROR: VSIX file was not created"
            exit 1
          fi

          if [ ! -f "resources/icon.png" ]; then
            echo "ERROR: resources/icon.png is missing"
            exit 1
          fi

          unzip -t "$VSIX_FILE" >/dev/null
          if unzip -Z1 "$VSIX_FILE" | grep -E '^extension/out/test/'; then
            echo "ERROR: VSIX contains compiled test files"
            exit 1
          fi
          echo "vsix_file=$VSIX_FILE" >> "$GITHUB_OUTPUT"
          echo "Verified VSIX: $VSIX_FILE"

      - name: Audit packaged VSIX artifact
        working-directory: .
        run: |
          uv build
          python3 scripts/audit_release_artifacts.py --require all

      - name: Check VSCE token
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "ERROR: VSCE_PAT is empty. Check the release environment secret."
            exit 1
          fi
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to VS Code Marketplace
        run: |
          if [ "$RELEASE_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="${RELEASE_INPUT_VERSION}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi

          for attempt in $(seq 1 5); do
            set +e
            OUTPUT="$(npx vsce publish --packagePath "$VSIX_FILE" -p "$VSCE_PAT" 2>&1)"
            STATUS=$?
            set -e
            echo "$OUTPUT"

            if [ "$STATUS" -eq 0 ]; then
              exit 0
            fi
            if echo "$OUTPUT" | grep -Eiq "already (exists|published)|version.*already"; then
              echo "VS Code Marketplace already has version $VERSION; continuing."
              exit 0
            fi

            echo "VS Code Marketplace publish failed (attempt $attempt/5); retrying..."
            sleep $((attempt * 30))
          done

          echo "ERROR: VS Code Marketplace publish failed after retries"
          exit 1
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          VSIX_FILE: ${{ steps.verify.outputs.vsix_file }}

      - name: Verify Marketplace version is visible
        run: |
          if [ "$RELEASE_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="${RELEASE_INPUT_VERSION}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi

          for attempt in $(seq 1 20); do
            if npx vsce show u9401066.asset-aware-mcp --json > marketplace.json; then
              if VERSION="$VERSION" node -e "const fs=require('fs'); const data=JSON.parse(fs.readFileSync('marketplace.json','utf8')); const wanted=process.env.VERSION; const versions=[data.version, data.latestVersion, ...(data.versions || []).map((v) => v.version)].filter(Boolean); process.exit(versions.includes(wanted) ? 0 : 1);"; then
                echo "VS Code Marketplace version $VERSION is visible."
                exit 0
              fi
            fi
            echo "VS Code Marketplace version $VERSION not visible yet (attempt $attempt/20); retrying..."
            sleep 30
          done

          echo "ERROR: VS Code Marketplace version $VERSION was not visible after publish"
          exit 1

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vscode-extension
          path: vscode-extension/*.vsix

  # ==========================================
  # 建立 GitHub Release
  # ==========================================
  github-release:
    name: 🚀 Create GitHub Release
    runs-on: ubuntu-latest
    needs: [publish-pypi, publish-vscode]
    permissions:
      contents: write # Required to create the GitHub Release and upload its VSIX.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download VSIX
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: vscode-extension
          path: ./release-assets/

      - name: Get version from tag
        id: version
        run: |
          if [ "$RELEASE_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="${RELEASE_INPUT_VERSION}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: invalid release version"
            exit 1
          fi
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract changelog
        id: changelog
        run: |
          # Extract changelog for current version
          VERSION="$RELEASE_VERSION"
          sed -n "/## \[$VERSION\]/,/## \[/p" CHANGELOG.md | head -n -1 > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "See CHANGELOG.md for details" > release_notes.md
          fi
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c12583777ecdfd3be55c69cf75464299dc01057e # v3
        with:
          tag_name: "v${{ steps.version.outputs.version }}"
          target_commitish: ${{ github.sha }}
          name: "v${{ steps.version.outputs.version }}"
          body_path: release_notes.md
          files: |
            release-assets/*.vsix
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true
